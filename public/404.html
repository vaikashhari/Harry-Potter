<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050402" />
    <title>Lost in the castle — Hogwarts</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 35%, rgba(93, 54, 145, .28), transparent 38%),
          radial-gradient(circle at 50% 100%, rgba(18, 12, 7, .9), #050402 68%);
        color: #eee7d8;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
      }
      main { width: min(680px, 90vw); padding: 48px 24px; }
      .crest {
        width: 92px; height: 92px; margin: 0 auto 28px;
        display: grid; place-items: center;
        border: 1px solid rgba(224, 204, 157, .45);
        border-radius: 50%;
        box-shadow: 0 0 50px rgba(134, 59, 255, .22);
        color: #e0cc9d;
        font-size: 42px;
      }
      .eyebrow {
        margin: 0 0 14px;
        color: #b8a989;
        font: 600 12px/1.4 system-ui, sans-serif;
        letter-spacing: .24em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: clamp(46px, 10vw, 88px); line-height: .95; }
      p {
        margin: 24px auto 32px;
        max-width: 520px;
        color: #bcb4a5;
        font: 16px/1.7 system-ui, sans-serif;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 24px;
        border: 1px solid rgba(224, 204, 157, .55);
        border-radius: 999px;
        color: #eee7d8;
        text-decoration: none;
        font: 700 13px/1 system-ui, sans-serif;
        letter-spacing: .08em;
        text-transform: uppercase;
        transition: transform .2s ease, background .2s ease;
      }
      a:hover { transform: translateY(-2px); background: rgba(134, 59, 255, .18); }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="crest" aria-hidden="true">✦</div>
      <p class="eyebrow">The castle moved the staircases</p>
      <h1>404</h1>
      <p>This corridor does not exist. Return to the castle and continue your journey through Hogwarts.</p>
      <a href="/">Return to Hogwarts</a>
    </main>
  </body>
</html>
